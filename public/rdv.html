<!DOCTYPE html>
<html lang="fr-BE">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Prendre Rendez-vous — Cabinet Dentaire à Liège</title>
<meta name="description" content="Réservez votre rendez-vous chez le dentiste à Liège en ligne, 7j/7 : choisissez une date, un créneau disponible et confirmez en quelques clics." />
<link rel="canonical" href="https://www.cabinet-dentaire-liege.be/rdv.html" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Cabinet Dentaire Sourire & Santé" />
<meta property="og:title" content="Prendre Rendez-vous — Cabinet Dentaire à Liège" />
<meta property="og:description" content="Réservez votre rendez-vous chez le dentiste à Liège en ligne, 7j/7." />
<meta property="og:url" content="https://www.cabinet-dentaire-liege.be/rdv.html" />
<meta property="og:locale" content="fr_BE" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%B7%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="rdv">

<div id="layout-header"></div>

<section>
  <h2>Prendre rendez-vous en ligne</h2>
  <p class="info-msg">Choisissez une date, puis un créneau disponible, et complétez vos informations.</p>

  <div id="alert-zone"></div>

  <div class="booking-layout">
    <div class="booking-panel">
      <div class="field">
        <label for="date-input">1. Choisissez une date</label>
        <input type="date" id="date-input" />
      </div>

      <div class="field">
        <label>2. Choisissez un créneau</label>
        <div id="slots-container">
          <p class="info-msg">Sélectionnez d'abord une date.</p>
        </div>
      </div>
    </div>

    <div class="booking-panel">
      <form id="booking-form">
        <div class="field">
          <label>3. Vos informations</label>
        </div>
        <div class="field">
          <label for="nom">Nom complet *</label>
          <input type="text" id="nom" required />
        </div>
        <div class="field">
          <label for="email">Email *</label>
          <input type="email" id="email" required />
        </div>
        <div class="field">
          <label for="telephone">Téléphone *</label>
          <input type="tel" id="telephone" required />
        </div>
        <div class="field">
          <label for="motif">Motif de la visite (optionnel)</label>
          <textarea id="motif" rows="3"></textarea>
        </div>
        <button type="submit" class="btn" id="submit-btn" disabled>
          Confirmer le rendez-vous
        </button>
      </form>
    </div>
  </div>
</section>

<div id="layout-footer"></div>
<script src="js/layout.js"></script>
<script src="js/animations.js"></script>
<script src="js/booking.js"></script>
</body>
</html>
